name: Codex Review Gate

# Gibt das Codex-Urteil als echten Check-Run aus — damit Branch Protection
# und Auto-Merge darauf warten koennen.
#
# WARUM DAS NOETIG IST
# --------------------
# Am 19.09.2026 lagen in diesem Repo zwischen «ready for review» und Merge
# 57 s (#56), 4 s (#57), 20 s (#58), 2 s (#59) und 63 s (#60). Ein Codex-Lauf
# braucht 36 bis 124 Sekunden; in keinem der fuenf Faelle lag beim Merge ein
# Ergebnis vor, bei #57 und #59 startete der Lauf erst danach. Zwei Anlaeufe,
# das ueber einen vereinbarten Ablauf zu regeln, sind gescheitert — #58 trug
# die Wartebedingung in der eigenen Checkliste, bei #60 hatte ein Agent den PR
# selbst auf ready geschaltet, um das Zeitfenster zu erzeugen. Es wurde
# 63 Sekunden gross und reichte trotzdem nicht.
#
# Eine dritte Vereinbarung waere dieselbe Schraube ein drittes Mal. Was
# fehlt, ist eine Schranke — und eine Schranke braucht einen Check-Run.
# Codex erzeugt keinen: Ein Befund ist ein Review-Objekt, ein befundloser
# Lauf ein Issue-Kommentar, der Laufstatus eine Tabelle in einem dritten
# Kommentar. Keines von dreien kann ein Check sein oder «approven».
#
# WIRKSAM WIRD DAS ERST ALS REQUIRED CHECK
# ----------------------------------------
# Dieser Job blockiert von sich aus nichts. Er muss in den Branch-Protection-
# Regeln (oder einem Ruleset) fuer den Default-Branch als required check
# eingetragen werden — Name: `codex-gate`. Das ist eine Repo-Einstellung, die
# der Agent-Proxy mit HTTP 403 sperrt; sie kann nur ein Mensch vornehmen.
# Solange das nicht geschehen ist, ist dieser Job ein Hinweis und keine
# Schranke.
#
# WAS ER NICHT LEISTET
# --------------------
# Er belegt, dass Codex DIESEN Commit angesehen hat. Ob gemeldete Befunde
# auch behoben oder beantwortet wurden, prueft er nicht — das bleibt Sache
# der Reviewerin. Ein Gate, das mehr behauptet, als es misst, ist genau der
# Haken, gegen den es gebaut ist.

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

# Nur Lesen. Der Anstoss laeuft ueber ein separates Token (siehe unten) und
# braucht die Rechte des `GITHUB_TOKEN` nicht.
#
# Beiseite, weil es Zeit kostet, es noch einmal herauszufinden: Wollte man
# mit dem `GITHUB_TOKEN` auf einem PR kommentieren, braucht es
# `pull-requests: write`, nicht `issues: write` — der Endpunkt heisst zwar
# `issues/{n}/comments`, das Ziel ist aber ein Pull Request. Mit
# `pull-requests: read` antwortet er 403 «Resource not accessible by
# integration». Am 19.09.2026 auf PR #64 gemessen. Nuetzt hier trotzdem
# nichts, siehe den Anstoss-Schritt.
permissions:
  contents: read
  pull-requests: read

concurrency:
  # Ein neuer Push macht das Warten auf den alten Head gegenstandslos.
  group: codex-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-gate:
    name: codex-gate
    # Ein Draft wird nicht gemergt, also gibt es hier nichts zu schuetzen.
    #
    # NICHT deshalb, weil auf einem Draft nichts kaeme — das war die erste
    # Begruendung und sie ist widerlegt: PR #62 dieses Repos trug am
    # 19.09.2026 rund dreissig Sekunden nach dem Anlegen als Draft die
    # Environment-Meldung. (PR #56 desselben Tages trug als Draft stundenlang
    # nichts; woran der Unterschied haengt, ist ungemessen.) Gewartet wird so
    # oder so nicht — ein Draft ist kein Merge-Kandidat.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_API: ${{ github.api_url }}/repos/${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Wie lange auf ein Urteil gewartet wird, bevor der Job rot wird.
      # Die vier gemessenen Laeufe lagen bei 36 bis 124 Sekunden; gewartet
      # wird das Zehnfache der bekannten Obergrenze, weil ein Timer auf die
      # laengste bekannte Dauer beim ersten laengeren Lauf falsch geht.
      WARTE_SEKUNDEN: "1200"
      # Wenn der `@codex review`-Anstoss nicht gesetzt werden konnte, wartet
      # der Job nur noch hierauf — lange genug fuer einen Menschen, der
      # sofort von Hand kommentiert, kurz genug, um keine 20 Minuten Laufzeit
      # fuer eine Frage zu verbrennen, die nie gestellt wurde.
      WARTE_OHNE_ANSTOSS_SEKUNDEN: "180"
      ABSTAND_SEKUNDEN: "30"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Der Stichtag fuer Kommentare. Ohne ihn zaehlte eine Befundlos-Meldung
      # aus einem frueheren Lauf als Urteil ueber den Commit, der jetzt
      # gemergt wird. Reviews haengen ohnehin an `commit_id`.
      - name: Stichtag des Head-Commits holen
        id: stichtag
        run: |
          set -euo pipefail
          date=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GH_API/commits/$HEAD_SHA" | python -c \
            'import json,sys; print(json.load(sys.stdin)["commit"]["committer"]["date"])')
          echo "since=$date" >> "$GITHUB_OUTPUT"
          echo "Stichtag: $date"

      # Codex laeuft laut seinem eigenen Infokasten auf drei Ausloeser an:
      # PR zum Review geoeffnet, Draft auf ready gestellt, oder ein
      # `@codex review`-Kommentar. Ein PUSH ist keiner davon — ohne diesen
      # Schritt haette der neue Head nie ein Urteil und das Gate liefe bei
      # jedem Push in den Timeout.
      #
      # Ungeprueft ist, ob Codex auf einen Kommentar des GITHUB_TOKEN-Bots
      # reagiert. Tut er es nicht, endet der Job im Timeout und sagt dort,
      # dass ein Mensch `@codex review` schreiben muss.
      #
      # DER STATUSCODE WIRD GEPRUEFT, UND ZWAR AUS MESSUNG.
      # Die erste Fassung lautete `curl -sS ... -o /dev/null` und meldete
      # danach «Review nach Push angestossen». Am 19.09.2026 auf PR #64
      # gemessen: Der Kommentar erschien nie, der Schritt lief gruen durch.
      # `curl -sS` endet bei einem HTTP-Fehler mit Exit 0 — die Erfolgszeile
      # war eine Behauptung ueber etwas, das nicht geprueft wurde. Das Gate
      # wartete anschliessend 20 Minuten auf eine Antwort auf eine Frage,
      # die nie gestellt worden war.
      # WARUM HIER EIN EIGENES TOKEN STEHT — gemessen, nicht vermutet.
      # Am 19.09.2026 auf PR #64 setzte der Job den Kommentar mit dem
      # `GITHUB_TOKEN` erfolgreich (HTTP 201). Codex antwortete vier Sekunden
      # spaeter:
      #
      #     To use Codex here, create a Codex account and connect to github.
      #
      # Der Anstoss ERREICHT Codex also; er wird abgelehnt, weil
      # `github-actions[bot]` kein Codex-Konto hat. Codex bindet die Anfrage
      # an das kommentierende Konto. Mit dem `GITHUB_TOKEN` ist dieser Weg
      # damit nicht zu haben, gleich welche Berechtigung er traegt.
      #
      # Fehlt das Token, unterbleibt der Anstoss — statt einen Kommentar zu
      # setzen, der nur eine Absage provoziert.
      #
      # DER SCHRITT BRICHT DEN JOB NICHT AB. Die zweite Fassung endete mit
      # `exit 1`. Das war der Ausschlag in die Gegenrichtung: Kann der
      # Anstoss nicht gesetzt werden, koennte trotzdem ein Mensch
      # `@codex review` kommentiert haben — am selben Tag genau so geschehen.
      # Ein harter Abbruch haette das Urteil, das danach vorlag, nie gelesen.
      - name: Nach einem Push einen Review anstossen
        id: anstoss
        if: github.event.action == 'synchronize'
        # DAS TOKEN STEHT NUR HIER, nicht job-weit. Es ist ein PAT eines
        # MENSCHEN und handelt repo-uebergreifend in dessen Namen. Job-weit
        # gesetzt laege es auch in der Umgebung der Schritte, die
        # `scripts/classify_codex_review.py` AUS DEM AUSGECHECKTEN PR-STAND
        # ausfuehren — auf einem PR aus demselben Repo koennte eine Aenderung
        # an diesem Skript das Token also auslesen und wegschicken.
        #
        # Befund eines Codex-Reviews auf PR #64 (P1), 19.09.2026. Er war
        # richtig: Die erste Fassung hatte es job-weit deklariert.
        env:
          # Optional. PAT eines Menschen MIT Codex-Konto, Scope `public_repo`
          # bzw. `repo`. Fehlt es, unterbleibt der Anstoss — mit dem
          # `GITHUB_TOKEN` geht es nachweislich nicht.
          ANSTOSS_TOKEN: ${{ secrets.CODEX_ANSTOSS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ANSTOSS_TOKEN:-}" ]; then
            echo "gesetzt=uebersprungen" >> "$GITHUB_OUTPUT"
            echo "::notice::Kein CODEX_ANSTOSS_TOKEN hinterlegt — kein Anstoss."
            echo 'Der GITHUB_TOKEN taugt dafuer nicht: Codex lehnt einen'
            echo 'Anstoss von github-actions[bot] ab, weil das Konto kein'
            echo 'Codex-Konto hat (gemessen 19.09.2026, PR #64). Wer den'
            echo 'Anstoss automatisch will, hinterlegt ein PAT eines Menschen'
            echo 'MIT Codex-Konto als Secret CODEX_ANSTOSS_TOKEN.'
            exit 0
          fi
          code=$(curl -sS -o anstoss.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ANSTOSS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GH_API/issues/$PR/comments" \
            -d '{"body":"@codex review"}')
          echo "HTTP $code"
          if [ "$code" = "201" ]; then
            echo "gesetzt=true" >> "$GITHUB_OUTPUT"
            echo "Review nach Push angestossen."
            exit 0
          fi
          echo "gesetzt=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Der Anstoss @codex review ist nicht gesetzt worden (HTTP $code)."
          echo "Antwort der API:"
          cat anstoss.json
          echo
          # Hier stand der Rat, die repo-weite Vorgabe unter Settings →
          # Actions → General auf «Read and write» zu stellen. Ein
          # Codex-Review auf PR #64 hat ihn zerlegt: Die Vorgabe ist keine
          # Obergrenze, der `permissions:`-Block hebt sie fuer PRs aus
          # demselben Repo an. Der Rat haette also die Vorgabe JEDES
          # Workflows aufgeweicht und den Fehler stehen lassen.
          echo 'Zwei bekannte Ursachen, in dieser Reihenfolge pruefen:'
          echo '1. Der Endpunkt issues/{n}/comments zeigt hier auf einen PULL'
          echo '   REQUEST. Dafuer verlangt GitHub pull-requests: write, nicht'
          echo '   issues: write. Den permissions-Block oben pruefen.'
          echo '2. Laeuft der PR aus einem FORK, werden angeforderte'
          echo '   Schreibrechte auf read-only gekuerzt, unabhaengig vom'
          echo '   permissions-Block. Dann hilft nur ein Anstoss von Hand.'

      - name: Auf das Codex-Urteil warten
        id: gate
        env:
          SINCE: ${{ steps.stichtag.outputs.since }}
          ANSTOSS: ${{ steps.anstoss.outputs.gesetzt }}
        run: |
          set -euo pipefail
          # Konnte der Anstoss nicht gesetzt werden, ist auf nichts zu warten
          # ausser auf einen Menschen, der von Hand kommentiert. Zwanzig
          # Minuten dafuer zu blockieren, kostet Laufzeit ohne Ertrag.
          frist="$WARTE_SEKUNDEN"
          case "$ANSTOSS" in
            false|uebersprungen) frist="$WARTE_OHNE_ANSTOSS_SEKUNDEN" ;;
          esac
          echo "Frist: ${frist}s"
          start=$(date +%s)
          ende=$(( start + frist ))
          bestaetigt=0
          hole() {
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GH_API/pulls/$PR/reviews?per_page=100" -o reviews.json
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GH_API/issues/$PR/comments?per_page=100" -o comments.json
          }

          while :; do
            hole

            # `env -u GITHUB_OUTPUT`: Das Skript schreibt dorthin, sobald die
            # Variable gesetzt ist. In der Schleife waere das je Runde ein
            # weiteres `state=` in derselben Datei — die Ausgabe des Jobs
            # haenge dann daran, welchen Wert der Runner zuletzt liest.
            # Geschrieben wird deshalb genau einmal, nach der Schleife.
            state=$(env -u GITHUB_OUTPUT python scripts/classify_codex_review.py \
              --head-sha "$HEAD_SHA" --reviews reviews.json \
              --comments comments.json --since "$SINCE" | sed -n 's/^state=//p')
            echo "[$(date -u +%H:%M:%S)] $state"

            # `clear` heisst: Tabelle fertig, kein Review-Objekt gesehen.
            # DAS IST DER GEFAEHRLICHSTE ZUSTAND, und zwar gemessen. Am
            # 19.09.2026 auf PR #64 reichte Codex sein Review-Objekt um
            # 13:54:32 ein, die Tabelle sprang um 13:54:34 auf `Completed` —
            # und eine Abfrage NACH 13:54:34 lieferte fuer die Reviews
            # trotzdem `[]`. Eine zwischengespeicherte Antwort sieht aus wie
            # eine aktuelle. Wer hier beim ersten Mal zuschlaegt, faerbt das
            # Gate gruen, waehrend ein Befund vorliegt — genau der Haken,
            # gegen den es gebaut ist.
            #
            # Deshalb: `clear` gilt erst, wenn es zwei Abfragen im Abstand
            # von ABSTAND_SEKUNDEN ueberlebt. Ein Befund, der noch unterwegs
            # ist, hat dann Zeit, sichtbar zu werden.
            if [ "$state" = "clear" ]; then
              bestaetigt=$((bestaetigt + 1))
              if [ "$bestaetigt" -ge 2 ]; then
                echo "clear zum zweiten Mal — bestaetigt."
                break
              fi
              echo "clear zum ersten Mal — Bestaetigungsrunde."
            elif [ "$state" = "running" ]; then
              # Ein Lauf ist in der Luft. Dann gilt die LANGE Frist, auch
              # wenn der Anstoss nicht von hier kam — die kurze Frist ist
              # dafuer da, nicht auf etwas zu warten, das nie kommt, nicht
              # dafuer, etwas abzuschneiden, das schon laeuft.
              #
              # Am 19.09.2026 auf PR #64 genau so passiert: Die kurze Frist
              # von 180 s lief um 14:10:54 ab, der Lauf hatte um 14:08:38
              # begonnen und war noch nicht fertig. Ein Codex-Lauf braucht
              # bis 187 s; eine Frist, die kuerzer ist als der Lauf, meldet
              # «kein Urteil» ueber ein Urteil, das gerade entsteht.
              bestaetigt=0
              ende=$(( start + WARTE_SEKUNDEN ))
            else
              bestaetigt=0
              # Alles andere ausser `pending` ist sofort ein Ergebnis, auch
              # ein schlechtes: Auf eine Kontingent- oder Environment-Meldung
              # weiterzuwarten hiesse, eine Absage fuer Stille zu halten.
              [ "$state" != "pending" ] && break
            fi
            [ "$(date +%s)" -ge "$ende" ] && break
            sleep "$ABSTAND_SEKUNDEN"
          done

          # DIE BESTAETIGUNG DARF DIE FRIST UEBERLEBEN.
          # Wird `clear` zum ersten Mal genau in der letzten Runde gesehen,
          # bricht die Fristpruefung darunter die Schleife ab — mit
          # `bestaetigt=1`. Die Endauswertung laese dieselben Dateien noch
          # einmal, faende `clear` und meldete `proven=true`: gruen aus genau
          # der einen, moeglicherweise veralteten Beobachtung, gegen die die
          # Bestaetigungsrunde gebaut ist.
          #
          # Befund eines Codex-Reviews auf PR #64 (P1), 19.09.2026. Er war
          # richtig — die Luecke war da, seit die Bestaetigungsrunde
          # existierte, und zwar genau in dem Zweig, der sie tragen soll.
          #
          # Die Runde wird deshalb nachgeholt, auch nach Fristablauf. Sie
          # kostet einmalig ABSTAND_SEKUNDEN und nur im Grenzfall.
          if [ "$bestaetigt" -eq 1 ]; then
            echo "clear war beim Fristablauf unbestaetigt — eine Runde wird nachgeholt."
            sleep "$ABSTAND_SEKUNDEN"
            hole
          fi

          # Dieselben Dateien, dieselbe Einordnung — nur diesmal mit
          # `GITHUB_OUTPUT`, damit `state`, `reason` und `proven` je genau
          # einmal in der Datei stehen.
          python scripts/classify_codex_review.py \
            --head-sha "$HEAD_SHA" --reviews reviews.json \
            --comments comments.json --since "$SINCE"

      # Ueber `env`, nicht ueber `${{ }}` im Skript: Der Grund kann einen
      # woertlich zitierten Fremdtext enthalten, und `${{ }}` setzt ihn vor
      # dem Start in die Shell ein.
      - name: Ergebnis durchreichen
        env:
          STATE: ${{ steps.gate.outputs.state }}
          REASON: ${{ steps.gate.outputs.reason }}
          PROVEN: ${{ steps.gate.outputs.proven }}
          ANSTOSS: ${{ steps.anstoss.outputs.gesetzt }}
        run: |
          {
            echo "## Codex Review Gate"
            echo
            echo "**Ergebnis:** \`$STATE\`"
            echo
            echo "$REASON"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$PROVEN" = "true" ]; then
            echo "Codex hat $HEAD_SHA angesehen: $STATE"
            exit 0
          fi

          {
            echo
            echo "### Was jetzt zu tun ist"
            echo
            echo "- \`pending\` — Codex ist nicht rechtzeitig fertig geworden."
            echo "  \`@codex review\` auf dem PR kommentieren und diesen Job neu starten."
            echo "- \`quota\` — Kontingent aufgebraucht. Es wurde **nichts** geprueft."
            echo "  Das Kontingent haengt am Konto, nicht am Repo."
            echo "- \`environment\` — fuer dieses Repo fehlt eine Codex-Environment."
            echo "  Sie wird **je Repo** angelegt; eine fuers Konto genuegt nicht."
            echo "- \`unknown\` — Codex hat etwas Unbekanntes geschrieben. Der Text"
            echo "  steht oben woertlich. Einordnen und die Marker in"
            echo "  \`scripts/classify_codex_review.py\` ergaenzen."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ANSTOSS" = "false" ] || [ "$ANSTOSS" = "uebersprungen" ]; then
            {
              echo
              echo "### Achtung: der Anstoss ist gar nicht gesetzt worden"
              echo
              echo "Codex wurde nichts gefragt — \`pending\` heisst hier"
              echo "**nicht**, dass er nicht geantwortet hat."
              echo
              echo "**Ein Mensch muss \`@codex review\` auf diesem PR"
              echo "kommentieren.** Ein Push allein ist kein Codex-Ausloeser,"
              echo "und der \`GITHUB_TOKEN\` taugt als Absender nicht: Codex"
              echo "bindet die Anfrage an das kommentierende Konto, und"
              echo "\`github-actions[bot]\` hat keines (gemessen 19.09.2026)."
              echo
              echo "Automatisch geht es nur mit einem PAT eines Menschen mit"
              echo "Codex-Konto, hinterlegt als Secret \`CODEX_ANSTOSS_TOKEN\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "Kein Beleg, dass Codex $HEAD_SHA angesehen hat: $STATE"
          echo "$REASON"
          exit 1
