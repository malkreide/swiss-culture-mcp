name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: uv installieren
        run: pip install uv

      - name: Abhängigkeiten installieren
        run: uv pip install -e ".[dev]" --system

      # Der Pin wirkt nur, wenn `ruff` ihn auch aufruft: liegt frueher im
      # PATH ein anderes ruff, gewinnt jenes, und der Install meldet nichts.
      - name: Ruff-Pin (PATH und Modul gegen pyproject.toml)
        run: python scripts/check_ruff_pin.py

      - name: Linting mit ruff
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/

      - name: Syntax-Prüfung
        run: python -m py_compile src/swiss_culture_mcp/server.py

      - name: Import-Test
        run: python -c "from swiss_culture_mcp.server import mcp; print('Import OK')"

      - name: Unit-Tests (nur Python 3.11)
        if: matrix.python-version == '3.11'
        run: PYTHONPATH=src pytest tests/ -m "not live"
        timeout-minutes: 5

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # ruff kommt aus dem dev-Extra. Dieser Job hatte vorher nur den
      # separaten Pin-Schritt als ruff-Quelle; mit dessen Wegfall stand er
      # ohne Werkzeug da (`ruff: command not found`).
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - run: ruff check src/ tests/ scripts/
      - run: ruff format --check src/ tests/ scripts/
